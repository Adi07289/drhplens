# Keep-warm cron pinger for the DRHPLens HF Space (P19 — fights the free-tier
# cold-start sleep). Copied from scripts/cron_pinger.yml (Option B). GitHub Actions
# schedule cron has 5-15 min skew; cron-job.org (Option A) fires more punctually.
#
# DEPLOY-TIME HUMAN STEP (Plan 06.3-10): replace <user> below with the real HF
# username once the Space is created (it is not committed to the repo). Until then
# the ping curls a non-existent URL harmlessly (|| true). Then enable Actions:
# repo Settings → Actions → General → Allow all actions.
name: HF Spaces Cold-Start Pinger
on:
  schedule:
    - cron: "*/8 * * * *"   # every 8 min — under HF Spaces 30-min sleep threshold (sleep_time: 1800)
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping HF Space
        run: |
          # Replace <user> with your HF username before enabling (Plan 06.3-10).
          URL="https://huggingface.co/spaces/<user>/drhplens"
          echo "Pinging $URL ..."
          curl -s -o /dev/null -w "%{http_code}\n" -m 30 "$URL" || true

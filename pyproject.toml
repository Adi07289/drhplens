[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "compliance", "storage", "tools", "ui", "pipelines"]

[project]
name = "drhplens"
version = "0.1.0"
description = "Agentic RAG over Indian IPO prospectuses (DRHP/RHP) with span-level citations"
requires-python = ">=3.11"
dependencies = [
    # Agent orchestration
    "langgraph>=1.2,<2",
    # RAG ingestion + query engines
    "llama-index>=0.14,<0.15",
    "llama-index-vector-stores-qdrant",
    "llama-index-embeddings-huggingface",
    "llama-index-llms-google-genai",
    "llama-index-llms-groq",
    # PDF parsing
    "docling>=2.95,<3",
    "pdfplumber>=0.11",
    "pymupdf>=1.27",
    # Vector store
    "qdrant-client>=1.18,<2",
    # Embeddings + reranker
    # sentence-transformers/FlagEmbedding = the torch-based bge-m3 embedder + bge-reranker
    # (the Linux/production path). On Intel macOS torch 2.2.2 is incompatible with NumPy 2.x,
    # so tools/embedder.py + tools/reranker.py run fastembed (ONNX, no torch) instead.
    "sentence-transformers>=3",
    "FlagEmbedding",
    "fastembed>=0.8",
    # Gemini SDK: the agent nodes import `from google import genai` directly.
    "google-genai>=1.0",
    # Structured LLM outputs
    "instructor>=1.15,<2",
    # Schemas + validation
    "pydantic>=2.7,<3",
    # UI
    "streamlit>=1.36",
    # Observability
    "langfuse<3",
    # Evals — deepeval = the faithfulness LLM-judge (native GeminiModel judge, no
    # OpenAI). It stays in the CORE runtime set (the disclosed WR-03 intent — it is
    # the REPORTED faithfulness lane the release gate references). langfuse is pinned
    # <3 above (v4 is a full OTEL rewrite that still needs the `langchain` package,
    # deliberately NOT added).
    # NOTE (WR-03 / D-14 ragas decision): `ragas` is NOT here — it is heavy on HF
    # Spaces and is an OPTIONAL offline cross-check only, NEVER imported in CI or the
    # release gate (AI-SPEC Pitfall 5). It therefore lives in the [eval] optional-
    # dependencies group below (used only in local/CI eval, not the Space runtime) and
    # is deliberately absent from requirements.txt. See scripts/_check_dep_sync.py.
    "deepeval>=4.1,<5",
    # Utilities
    "tenacity",
    "python-dotenv",
    "httpx>=0.27",
    "typer",
    "rich",
    "tiktoken",
    # YAML — committed data files (the FAILGAL-01 /failures gallery reads
    # eval/failures/failures.yaml). PyYAML is currently only transitively present
    # (docling-core / transformers / langchain-core / omegaconf / …); declare it
    # explicitly so the render surface never breaks if a transitive parent is
    # pruned (06.2-RESEARCH Pitfall 5). Reference YAML lib, already resolved 6.0.3.
    "pyyaml>=6,<7",
    # Cite-check fuzzy matching (Pattern 3 per 01-RESEARCH.md)
    "rapidfuzz",
    # Indian market data (Phase 4 — peer multiples + historical panel).
    # yfinance pinned to 1.5.1 (major bump, smoke-tested in 04-01); jugaad-data
    # is the nsepy successor for NSE; requests-cache throttles screener/NSE fetches.
    "yfinance==1.5.1",
    "requests-cache==1.3.3",
    "jugaad-data==0.33.1",
    # ML / forecasting (Phase 5). Version-reconciled per 05-RESEARCH §"Version
    # reconciliation": allow the 3.x releases (very new pandas 3.0 / numpy 2.4
    # need them) while flooring at the CLAUDE.md-locked 2.x families. xgboost
    # native quantile loss (reg:quantileerror, 2.0+); mapie 1.x conformal
    # (ConformalizedQuantileRegressor); sklearn 1.5+ estimators/metrics; mlflow
    # 2.x local experiment tracking; matplotlib for calibration plots; shap for
    # the model-card feature attributions. The Diebold-Mariano PyPI package
    # (05-09 inlines a ~15-line DM test instead) is intentionally NOT declared.
    # nse (NseIndiaApi): approved at the 05-11 blocking-human legitimacy
    # checkpoint (Sigstore-attested, PyPI Trusted Publishing, GPL-3.0,
    # github.com/BennyThadikaran/NseIndiaApi) — powers the live Source-A crawl.
    "xgboost>=2.0",
    "mapie>=1.4,<2",
    "scikit-learn>=1.5",
    "mlflow>=2.14",
    "matplotlib>=3.8",
    "shap>=0.46",
    "nse>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-timeout",
    "ruff",
    "mypy",
]
# eval: OPTIONAL local/CI-only eval extras — NOT installed on the HF Space runtime
# (WR-03 / D-14 decision). `ragas` is a heavy dependency (pulls its own LLM/embeddings
# stack) and is used only as an offline cross-check of the headline RAG metrics; it is
# NEVER imported by CI, scripts/release_gate.py, or the deployed app (AI-SPEC Pitfall 5).
# Install with `pip install -e ".[eval]"` when running the ragas cross-check locally.
# Keeping it OUT of core [project.dependencies] + requirements.txt is what keeps the
# Space image lean. The deterministic release gate + deepeval faithfulness lane do NOT
# depend on ragas, so the deploy set never regresses by its absence.
eval = [
    "ragas>=0.4,<0.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "eval: marks tests as eval tests (requires --run-eval)",
    "integration: marks tests as integration tests",
]
timeout = 60

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

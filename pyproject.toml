[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "compliance", "storage", "tools", "ui", "pipelines"]

[project]
name = "drhplens"
version = "0.1.0"
description = "Agentic RAG over Indian IPO prospectuses (DRHP/RHP) with span-level citations"
requires-python = ">=3.11"
dependencies = [
    # ── SERVE (runtime) set — what app.py + the agent + render surfaces import at
    # runtime. Ingest/forecast/market-crawl/legacy heavies (docling+torch, the
    # Phase-5 ML stack, market-data crawlers, sentence-transformers/llama-index) live
    # in the [ingest] extra below and are NOT installed on the deploy — that cut ~2 GB
    # of torch from the Space/Streamlit-Cloud image. This list MUST stay IDENTICAL to
    # requirements.txt (scripts/_check_dep_sync.py enforces it).
    # Agent orchestration
    "langgraph>=1.2,<2",
    # Vector store
    "qdrant-client>=1.18,<2",
    # Embeddings + reranker (ONNX via fastembed — no torch)
    "fastembed>=0.8",
    # LLM clients: Groq (default, OpenAI-compat endpoint) + Gemini (fallback).
    # agent/llm.py imports `from openai import OpenAI` and `from google import genai`.
    "openai>=1.40",
    "google-genai>=1.0",
    "instructor>=1.15,<2",
    # Schemas + validation
    "pydantic>=2.7,<3",
    # UI
    "streamlit>=1.36",
    # Observability
    "langfuse<3",
    # Evals — deepeval = the faithfulness LLM-judge (native GeminiModel judge, no
    # torch, no OpenAI). Stays in the runtime set (disclosed WR-03 intent). ragas
    # lives in the [eval] extra (heavy, offline cross-check only).
    "deepeval>=4.1,<5",
    # Utilities
    "tenacity",
    "python-dotenv",
    "httpx>=0.27",
    "typer",
    "rich",
    "tiktoken",
    # YAML — the FAILGAL-01 /failures gallery reads eval/failures/failures.yaml;
    # declared explicitly so the render surface never breaks if a transitive parent
    # is pruned (06.2-RESEARCH Pitfall 5).
    "pyyaml>=6,<7",
    # Cite-check fuzzy matching (Pattern 3 per 01-RESEARCH.md)
    "rapidfuzz",
]

[project.optional-dependencies]
# Ingest / forecasting / market-crawl / legacy-embedder — NOT installed on the
# deploy (the serve app reads committed data + pre-rendered artifacts, never these).
# Install locally for the ingest pipeline, the Phase-5 forecaster, and live crawls:
#   pip install -e ".[ingest]"
ingest = [
    # RAG ingestion + query engines (legacy llama-index path; serve uses fastembed)
    "llama-index>=0.14,<0.15",
    "llama-index-vector-stores-qdrant",
    "llama-index-embeddings-huggingface",
    "llama-index-llms-google-genai",
    "llama-index-llms-groq",
    # PDF parsing (Docling pulls torch via docling-ibm-models)
    "docling>=2.95,<3",
    "pdfplumber>=0.11",
    "pymupdf>=1.27",
    # Torch-based embedder/reranker (Linux path); serve runs ONNX fastembed instead
    "sentence-transformers>=3",
    "FlagEmbedding",
    # Indian market data (Phase 4 crawl — peer multiples + historical panel)
    "yfinance==1.5.1",
    "requests-cache==1.3.3",
    "jugaad-data==0.33.1",
    "nse>=3.1",
    # ML / forecasting (Phase 5)
    "xgboost>=2.0",
    "mapie>=1.4,<2",
    "scikit-learn>=1.5",
    "mlflow>=2.14",
    "matplotlib>=3.8",
    "shap>=0.46",
]
dev = [
    "pytest>=8",
    "pytest-timeout",
    "ruff",
    "mypy",
]
# eval: OPTIONAL local/CI-only eval extras — NOT installed on the HF Space runtime
# (WR-03 / D-14 decision). `ragas` is a heavy dependency (pulls its own LLM/embeddings
# stack) and is used only as an offline cross-check of the headline RAG metrics; it is
# NEVER imported by CI, scripts/release_gate.py, or the deployed app (AI-SPEC Pitfall 5).
# Install with `pip install -e ".[eval]"` when running the ragas cross-check locally.
# Keeping it OUT of core [project.dependencies] + requirements.txt is what keeps the
# Space image lean. The deterministic release gate + deepeval faithfulness lane do NOT
# depend on ragas, so the deploy set never regresses by its absence.
eval = [
    "ragas>=0.4,<0.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "eval: marks tests as eval tests (requires --run-eval)",
    "integration: marks tests as integration tests",
]
timeout = 60

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
